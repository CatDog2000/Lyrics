name: Simple Pages Deploy Test

on:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Create dummy file
        run: |
          mkdir -p ./test-site
          echo "<h1>Deployment Test</h1>" > ./test-site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './test-site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
